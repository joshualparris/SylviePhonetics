name: Validate security dependency update
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Resolve candidate versions
        run: |
          npm update follow-redirects qs --package-lock-only --ignore-scripts --no-audit
      - uses: actions/upload-artifact@v4
        with:
          name: candidate-lockfile
          path: |
            package.json
            package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium && npm run test:e2e
